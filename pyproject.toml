[project]
name = "ozoner"
version = "0.1.0"
description = "Search the public Ozon catalog with Scrapling"
readme = "README.md"
authors = [{ name = "fresh-milkshake" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["scrapling[fetchers]==0.5.1"]

[project.scripts]
ozoner = "ozoner.cli:main"

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

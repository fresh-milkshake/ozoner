site_name: Ozoner
site_description: Python-клиент публичной витрины Ozon
site_url: https://fresh-milkshake.github.io/ozoner/
repo_url: https://github.com/fresh-milkshake/ozoner
repo_name: fresh-milkshake/ozoner
site_author: fresh-milkshake
edit_uri: edit/mkdocs/docs/
theme:
  name: material
  language: ru
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang:
        - ru
        - en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
extra_css:
  - assets/ozoner.css
validation:
  links:
    anchors: warn
nav:
  - Обзор: index.md
  - Быстрый старт: start.md
  - Python API: api.md
  - Фильтры: filters.md
  - CLI и логирование: cli.md
  - Ошибки и решения: troubleshooting.md
